<!DOCTYPE html>
<html lang="en" dir="ltr"
  data-bs-theme="light"
  data-color-theme="Blue_Theme"
  data-boxed-layout="full"
  data-layout="vertical">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kingdom Connections</title>
    <link rel="icon" href="/kingdom-connections/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/kingdom-connections/favicon-512.png" sizes="512x512" type="image/png" />
    <link rel="apple-touch-icon" href="/kingdom-connections/favicon-180.png" />

    <!-- NetSimple / Bootstrap admin theme is intentionally NOT loaded
         unconditionally here — doing that for every route (including the
         public site and the Puck builder canvas) is what caused the admin
         theme's CSS to bleed into and override the public site's own
         styling. It's gated to admin/portal surfaces only, matching
         src/hooks/useAdminTheme.js's ref-counted mount/unmount. It used to
         be requested from right here via an inline <script>, but Vite's
         production build always appends its own bundled stylesheet <link>
         (Bootstrap + FontAwesome + site styles.css) at the very end of
         <head> regardless of where this tag sits in the source — which put
         the admin skin BEFORE that bundle in DOM order and let Bootstrap's
         base styles win same-specificity ties (visibly oversized fonts on
         admin pages). It's requested from src/main.jsx instead now, as the
         first thing that runs after the bundle's own <link> is already in
         the document — still before first paint (so no FOUC), but now
         after the bundle in DOM order (so the admin skin wins ties again,
         as it always relied on). -->
    <!-- Iconify (Solar icon pack, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
